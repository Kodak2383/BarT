name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: macos-15
    # Note: the deployment target is macOS 26, so this runner's SDK may be too old.
    # If the build fails on the SDK, switch to a macos-26 runner once one is available.

    steps:
    - uses: actions/checkout@v4

    - name: Install xcodegen
      run: |
        brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build
      run: |
        xcodebuild build \
          -project "BarT.xcodeproj" \
          -scheme "BarT" \
          -configuration Debug \
          -destination "platform=macOS"
