name: BarT
options:
  # This key MUST live under `options` — at the top level xcodegen ignores it silently,
  # PRODUCT_BUNDLE_IDENTIFIER stays empty, and the app runs with no bundle ID at all:
  # UserDefaults then falls back to the process name, and SMAppService ("Launch at login")
  # has nothing to tie the app to.
  bundleIdPrefix: de.andreduhme

settings:
  SWIFT_VERSION: "6.0"
  CODE_SIGN_STYLE: Automatic
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  BarT:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - BarT
    info:
      path: BarT/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSAccessibilityUsageDescription: "BarT needs accessibility access to detect and control other apps' menu bar icons."
    entitlements:
      path: BarT/BarT.entitlements
      properties:
        com.apple.security.app-sandbox: false
