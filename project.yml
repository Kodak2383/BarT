name: BarT
options:
  # Gehört zwingend unter `options` — auf oberster Ebene ignoriert xcodegen den Schlüssel
  # stillschweigend, PRODUCT_BUNDLE_IDENTIFIER bleibt leer, und die App läuft ganz ohne
  # Bundle-ID: UserDefaults fällt dann auf den Prozessnamen zurück und SMAppService
  # („Bei Anmeldung starten“) hat nichts, woran es die App festmachen könnte.
  bundleIdPrefix: de.andreduhme

settings:
  SWIFT_VERSION: "6.0"
  CODE_SIGN_STYLE: Automatic
  MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  BarT:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - BarT
    info:
      path: BarT/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSAccessibilityUsageDescription: "BarT benötigt Bedienungshilfen-Zugriff, um Menüleisten-Icons anderer Apps zu erkennen und zu steuern."
    entitlements:
      path: BarT/BarT.entitlements
      properties:
        com.apple.security.app-sandbox: false
